name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Fetch MediaPipe model asset
        shell: powershell
        run: |
          powershell.exe -ExecutionPolicy Bypass -File .\scripts\fetch_models.ps1

      - name: Lint and format check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run test suite (Pytest)
        run: |
          pytest -v

      - name: Headless subsystem self-check
        run: |
          python -m morph --headless-check
