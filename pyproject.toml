[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morph"
version = "2.2.0-rc1"
description = "Windows-local, offline, webcam-based accessibility research prototype with deterministic intent gating"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Pratham Kapoor", email = "prathamkapoor027@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Intended Audience :: Healthcare Industry",
]
dependencies = [
    "numpy==2.5.4",
    "opencv-python==5.0.0.93",
    "PySide6==6.12.0",
    "mediapipe==1.1.1",
    "pyttsx3==2.99",
    "pywin32==312",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[project.scripts]
morph = "morph.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
